<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d4ecc8" />
    <title>Toy Dairy</title>
    <!-- Non-blocking fonts: text renders immediately with system fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Nunito:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Nunito:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Nunito:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Instant first paint while React boots */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e8efe3;
        font-family:
          'Noto Sans SC',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
