# ToyDairy / talk — Orange Pi 语音对话流水线配置
# 路径：本地 hardware/talk 与板子 /home/talk 保持同步
# 修改本文件后无需改代码即可切换音色、API、设备等

# ---------------------------------------------------------------------------
# 戒指（BLE）— 身份仅认 MAC
# ---------------------------------------------------------------------------
ring:
  # 与 bluetooth 持久化一致；多枚 ring 时务必写唯一 MAC
  mac: "D0:A4:FF:FC:9F:3E"
  name: "ring"
  # 等待用户长按录音并自动上报的超时（秒）
  record_timeout_s: 120
  # 连接失败时是否再扫描刷新（仍只连上面的 MAC）
  rescan_on_connect: true
  scan_seconds: 12

# ---------------------------------------------------------------------------
# 对话 API（对接 docs/api.md → POST /api/chat）
# ---------------------------------------------------------------------------
chat:
  # 线上默认；也可改为本机/反代，例如 http://127.0.0.1:8787/api/chat
  base_url: "https://toydiary.pages.dev"
  path: "/api/chat"
  # 完整 URL 优先于 base_url+path（非空则直接使用）
  url: ""
  timeout_s: 60
  # 网络失败重试次数（手机热点/IPv6 抖动时建议 ≥3）
  retries: 3
  quiet_mode: false
  # 本地保留的历史轮数（user+toy 合计上限）
  history_limit: 12
  # 玩偶人格（写入 /api/chat 的 toy 字段，对齐 docs/api.md）
  toy:
    name: "小棉"
    role: "口袋里的旅行玩偶"
    traits:
      - "软萌"
      - "好奇"
      - "会撒娇"
    bio: "喜欢被装进口袋到处走，会把路边的小发现讲成故事。"
    monologue: "有我在，今天也要轻声说喜欢你。"
  memories: []
  # 无网络或 API 失败时的兜底回复
  offline_reply: "我好像走神了…你再说一次好不好？"

# ---------------------------------------------------------------------------
# 语音识别 STT（开源，板端）
# ---------------------------------------------------------------------------
stt:
  # vosk | whisper_cpp | external
  engine: "vosk"
  language: "zh"
  # Vosk 中文小模型目录（相对 talk 根或绝对路径）
  vosk_model_dir: "models/vosk-model-small-cn-0.22"
  # whisper.cpp 可执行文件与模型（engine=whisper_cpp 时）
  whisper:
    bin: "whisper-cli"
    model: "models/ggml-tiny.bin"
    language: "zh"
  # 识别前是否把 wav 重采样到 16k mono
  force_16k_mono: true

# ---------------------------------------------------------------------------
# 语音合成 TTS（开源，板端）— 四种可爱玩偶向预设
# ---------------------------------------------------------------------------
tts:
  # 当前启用的音色 id（见下方 voices）
  active_voice: "girl_soft"
  # piper | espeak | auto
  # auto：优先 Piper（自然中文），失败才 espeak
  engine: "auto"
  # 播放：auto=优先蓝牙 bluealsa，失败再板载 aplay
  player: "auto"
  # 蓝牙音箱 MAC
  bluetooth_mac: "52:5E:48:6A:8D:26"
  alsa_device: "auto"
  # 播放音量 0–100（写入 bluealsa；默认偏小 35）
  volume: 35
  # 软件增益（ffmpeg volume，1.0=不额外放大）
  software_gain: 0.85
  # A2DP 重采样：44100 通常更稳
  sample_rate: 44100
  # ALSA 缓冲（微秒）。0=驱动默认（推荐，避免错误 period 导致「一字一秒」）
  buffer_time_us: 0
  period_time_us: 0
  piper:
    bin: "piper"
    # 语速/韵律：1.0=正常；>1 更慢。过大易显「一顿一顿」
    length_scale: 0.98
    noise_scale: 0.667
    noise_w: 0.8
    # 句间静音秒数（Piper --sentence-silence）；略小更连贯
    sentence_silence: 0.16
  espeak:
    bin: "espeak-ng"
    voice_prefix: "zh"
  output_dir: "audio/tts"
  # ---- 音色预设（男女各二，偏玩偶/手帐陪伴感）----
  voices:
    # 女 · 软萌棉柔：略慢仍连贯
    girl_soft:
      label: "软萌小棉（女）"
      gender: "female"
      style: "soft"
      engine: "auto"
      piper:
        model: "voices/zh_CN-huayan-medium.onnx"
        config: "voices/zh_CN-huayan-medium.onnx.json"
        length_scale: 1.02
        noise_scale: 0.62
        sentence_silence: 0.15
      espeak:
        voice: "zh"
        speed: 145
        pitch: 55
        amplitude: 100

    # 女 · 明亮雀跃
    girl_bright:
      label: "雀跃小糖（女）"
      gender: "female"
      style: "bright"
      engine: "auto"
      piper:
        model: "voices/zh_CN-huayan-medium.onnx"
        config: "voices/zh_CN-huayan-medium.onnx.json"
        length_scale: 0.94
        noise_scale: 0.7
        sentence_silence: 0.12
      espeak:
        voice: "zh"
        speed: 165
        pitch: 70
        amplitude: 110

    # 男 · 温柔少年
    boy_soft:
      label: "温柔阿柚（男）"
      gender: "male"
      style: "soft"
      engine: "auto"
      piper:
        model: "voices/zh_CN-huayan-medium.onnx"
        config: "voices/zh_CN-huayan-medium.onnx.json"
        length_scale: 1.05
        noise_scale: 0.55
        sentence_silence: 0.16
      espeak:
        voice: "zh"
        speed: 140
        pitch: 28
        amplitude: 100

    # 男 · 元气少年
    boy_bright:
      label: "元气阿栗（男）"
      gender: "male"
      style: "bright"
      engine: "auto"
      piper:
        model: "voices/zh_CN-huayan-medium.onnx"
        config: "voices/zh_CN-huayan-medium.onnx.json"
        length_scale: 0.96
        noise_scale: 0.65
        sentence_silence: 0.12
      espeak:
        voice: "zh"
        speed: 160
        pitch: 38
        amplitude: 110

# ---------------------------------------------------------------------------
# 日志（触发与处理结果）
# ---------------------------------------------------------------------------
log:
  enabled: true
  level: "INFO"          # DEBUG / INFO / WARNING / ERROR
  dir: "logs"
  file: "talk.log"       # 完整路径: <talk>/logs/talk.log

# ---------------------------------------------------------------------------
# 流水线 / 路径
# ---------------------------------------------------------------------------
pipeline:
  # 工作目录（空=脚本所在 talk 根目录）
  root: ""
  audio_dir: "audio"
  history_file: "history/chat_history.json"
  log_dir: "logs"
  # 单次循环：wait_record | download_latest | once（测试用固定 wav）
  mode: "wait_record"
  # mode=once 时使用的测试 wav
  test_wav: ""
  # 是否在识别后打印文本
  verbose: true
  # 连续对话轮数上限；0=无限（Ctrl+C 结束）
  max_turns: 0

# ---------------------------------------------------------------------------
# 依赖提示（不参与运行，仅文档）
# ---------------------------------------------------------------------------
# notes:
#   STT: vosk + models/vosk-model-small-cn-0.22
#   TTS: piper 或 espeak-ng
#   戒指: bleak + ffmpeg（解码 Speex→WAV）
#   安装: scripts/setup_pi.sh
